site_name: Sandhi
site_description: Cache-aware AI routing, local egress control and accountable token usage.
site_url: https://anvai-labs.github.io/sandhi/
repo_url: https://github.com/anvai-labs/sandhi
repo_name: anvai-labs/sandhi
edit_uri: edit/develop/docs/
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  custom_dir: docs/overrides
  font: false
  icon:
    logo: material/transit-connection-variant
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
hooks:
  - scripts/docs_links.py
extra_css:
  - stylesheets/tokens.css
  - stylesheets/brand.css
exclude_docs: |
  /README.md
  overrides/
  product/evidence/
nav:
  - Start here: index.md
  - Efficiency and control:
      - Cache-aware routing and tokens: product/cache-aware-routing.md
      - Protocol and credential matrix: product/protocol-and-credential-matrix.md
      - Local ONNX evaluation: operator/embedded-onnx.md
      - Sensitive-text egress policy: operator/sensitive-policy.md
  - Operate:
      - Operator console: operator/dashboard.md
      - Backends and cache configuration: operator/backends.md
      - Identity and access: operator/oidc-sso.md
      - Identity groups: operator/identity-groups.md
      - Durable execution and recovery: operator/buffered-accounting.md
      - Accounting wait diagnostics: operator/accounting-wait-diagnostics.md
      - Buffered deadlines: operator/buffered-deadlines.md
      - Streaming deadlines: operator/streaming-deadlines.md
      - Stream body ownership: operator/stream-body-lifetime.md
      - Recovery drills: operator/recovery-drill.md
      - Embeddings and completions: operator/text-endpoints.md
      - Policy evaluation: operator/policy-evaluation.md
  - Understand:
      - Architecture and wire contract: adr/0001-sandhi-architecture-and-wire-contract.md
      - Two processing planes: adr/0004-two-plane-proxy-and-enforcement-boundary.md
      - Budget guarantees: product/metering-and-budget-guarantees.md
      - Accounting and evidence: product/attempt-accounting-and-evidence.md
      - Provider SDK baseline and API versions: reviews/provider-sdk-refresh-2026-11-12.md
      - Credential audit and fixture classification: reviews/credential-audit-2026-11-12.md
      - Portable Chat streams and typed Responses output: adr/0035-portable-chat-stream-output.md
      - Abandoned Prepared recovery: adr/0036-abandoned-prepared-recovery.md
      - Portable Responses source output: adr/0037-portable-responses-source-output.md
      - Coordinated Victor contract migration: adr/0038-coordinated-victor-contract-migration.md
      - Embedded endpoint profiles: adr/0039-shared-embedded-endpoint-profiles.md
      - Shared buffered source qualification: adr/0040-shared-buffered-source-qualification.md
      - Explicit gateway peer contract: adr/0041-explicit-gateway-peer-contract.md
      - "ADR-0042: Provider identity and budget namespaces": adr/0042-provider-identity-and-budget-namespace.md
      - Mandatory durable HTTP execution: adr/0043-mandatory-durable-http-execution.md
      - "ADR-0044: Native reference ownership": adr/0044-native-reference-ownership.md
      - "ADR-0045: Access-token resource audience": adr/0045-access-token-resource-audience.md
      - Qualified Responses streams: adr/0026-qualified-responses-stream-accounting.md
      - Qualified Codex accounting: adr/0027-qualified-codex-buffered-accounting.md
      - Qualified translated streams: adr/0028-qualified-translated-stream-accounting.md
      - Live tracked stream matrix: reviews/zai-router-tracked-translated-streams-2026-11-11.md
      - Terminal Chat usage profile: adr/0029-explicit-terminal-chat-usage-profile.md
      - Messages stream qualification prerequisite: adr/0030-messages-stream-usage-qualification.md
      - Qualified Messages streams and native-state limits: adr/0031-qualified-messages-stream-ownership.md
      - Live Messages cache and native-state evidence: reviews/zai-messages-tracked-streams-2026-11-12.md
      - Gemini stream qualification prerequisite: adr/0032-gemini-stream-usage-qualification.md
      - Qualified Gemini streams and EOF accounting: adr/0033-qualified-gemini-stream-ownership.md
      - Buffered output fidelity and source token evidence: adr/0034-buffered-source-evidence-and-output-fidelity.md
      - Cache reporting: adr/0010-cache-read-reporting-availability.md
  - Project:
      - Version 0.17.1 published: releases/v0.17.1.md
      - Version 0.17.0 unpublished checkpoint: releases/v0.17.0.md
      - Development PR progress: reviews/post-0.17.0-pr-train.md
      - Version 0.14.0: releases/v0.14.0.md
      - Version 0.13.0: releases/v0.13.0.md
      - Version 0.12.0: releases/v0.12.0.md
      - Documentation map: map.md
      - Release safeguards: product/release-safeguards.md
      - Contributing to these docs: contributing-docs.md
extra:
  generator: false
