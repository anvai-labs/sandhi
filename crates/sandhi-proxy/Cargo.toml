[package]
name = "sandhi-proxy"
description = "Sandhi reverse-proxy: sandhi-core + sandhi-providers + an HTTP listener. In-path (inline) egress gate with virtual keys + budgets + usage metering + the TD-0003 operator surface (key vault, admin API, sandhi CLI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "sandhi_proxy"
path = "src/lib.rs"

[[bin]]
name = "sandhi-proxy"
path = "src/main.rs"

[[bin]]
name = "sandhi"
path = "src/cli.rs"

[features]
default = []
# Release binaries opt into native SentinelPass daemon IPC. Keep the feature on
# the binary crate because release.yml builds `sandhi-proxy --features
# sentinelpass-ipc`; without this forwarding edge that documented release path
# asks Cargo for a feature the package does not define.
sentinelpass-ipc = ["sandhi-store/sentinelpass-ipc"]
# TD-0011 P3 (Scope 5): first-party OTLP export of gen_ai.* spans + metrics. DEFAULT OFF —
# disposable observability layered beside the prerequisite-free Prometheus `/metrics` path,
# which stays the default. Only the binary takes these deps (TD-0011 D1: library crates must
# not). HTTP/protobuf over the async reqwest client, not gRPC/tonic — the leaner tree.
otel-otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sandhi-core = { path = "../sandhi-core", version = "0.3.0" }
sandhi-providers = { path = "../sandhi-providers", version = "0.3.0" }
sandhi-store = { path = "../sandhi-store", version = "0.3.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.7"
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
tower = { version = "0.5", default-features = false }
# Direct (not just transitive): the explicit accept loop serves each
# connection with hyper's http1 builder directly (TD-0014 P3) — deliberately
# NOT hyper-util's auto builder, whose 24-byte h2c preface sniff buffers reads
# before hyper's header timer starts, exempting silent connections from the
# slowloris defence (adversarial-review finding 3). Sandhi's listener is
# HTTP/1-only until TD-0017 adds TLS/h2 with its own timeouts.
hyper = { version = "1", features = ["http1", "server"] }
# "http1" gates hyper-util's GracefulConnection impl for hyper's http1
# Connection — the drain watcher needs it; declare it, don't inherit it from
# reqwest's transitive feature unification.
hyper-util = { version = "0.1", features = ["server-graceful", "http1", "service", "tokio"] }
# TD-0017 P1: opt-in TLS termination. These versions are already present in the
# normal dependency graph through reqwest; declaring them makes the listener's
# ownership explicit without adding a second TLS implementation.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Constant-time admin-token compare (ADR-0004 D4). Already in the lockfile via rustls, so this
# adds no new crate — it swaps the hand-rolled loop for one with optimizer barriers.
subtle = { version = "2.6", default-features = false }
time = { version = "0.3", features = ["formatting"] }
# TD-0003 P1 operator CLI (thin HTTP client to the admin API).
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "blocking",
] }
# OTLP export (Scope 5, feature `otel-otlp`, default off). 0.32 across the board; the SDK's
# `testing` feature exposes the in-memory span exporter + `ManualReader` the leak tests use.
# `opentelemetry-otlp` selects the async HTTP/protobuf client (not the gRPC/tonic stack).
opentelemetry = { version = "0.32", optional = true, default-features = false, features = [
    "trace",
    "metrics",
] }
opentelemetry_sdk = { version = "0.32", optional = true, features = [
    "trace",
    "metrics",
    "testing",
    # Exposes ManualReader/PeriodicReader/InMemoryMetricExporter used by the leak tests.
    "experimental_metrics_custom_reader",
] }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = [
    "trace",
    "metrics",
    "http-proto",
    "http-json",
    "reqwest-client",
    "reqwest-rustls-webpki-roots",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["limit", "util"] }
wiremock = "0.6"
async-trait = "0.1"
