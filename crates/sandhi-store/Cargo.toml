[package]
name = "sandhi-store"
description = "Durable SQLite sink + usage aggregation queries for Sandhi. Not depended on by the language bindings (keeps the wheels free of bundled SQLite)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tracing = "0.1"
sandhi-core = { path = "../sandhi-core", version = "0.0.0" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
getrandom = "0.2"
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native",
] }
# Stable SentinelPass IPC contract (message types, envelope, client).
# Pinned to the released v0.8.0 tag; use path+`[patch]` for local dev:
#   [patch."https://github.com/anvai-labs/sentinelpass"]
#   sentinelpass-protocol = { path = "../../sentinelpass/sentinelpass-protocol" }
sentinelpass-protocol = { git = "https://github.com/anvai-labs/sentinelpass", tag = "v0.8.0" }
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "ledger"
harness = false
# `cargo test` must not execute benchmarks in CI; numbers come from `cargo bench`.
test = false
