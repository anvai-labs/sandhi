[package]
name = "sandhi-store"
description = "Durable SQLite sink + usage aggregation queries for Sandhi. Not depended on by the language bindings (keeps the wheels free of bundled SQLite)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tracing = "0.1"
sandhi-core = { path = "../sandhi-core", version = "0.10.1" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
getrandom = "0.2"
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native",
] }
# Stable SentinelPass IPC contract (message types, envelope, client).
# Optional and NON-default: the IPC backend (and its tokio runtime) ships only
# where the `sentinelpass-ipc` feature is enabled — release binary builds turn
# it on; crates consumers may enable it themselves. sentinelpass-protocol
# is published to crates.io; no local path patch is needed.
sentinelpass-protocol = { version = "0.13.3", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "time"], optional = true }

[features]
sentinelpass-ipc = ["dep:sentinelpass-protocol", "dep:tokio"]

[dev-dependencies]
# Test-only stdio control channel; protocol framing uses the real optional crate.
tokio = { version = "1", features = ["io-std", "io-util"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "ledger"
harness = false
# `cargo test` must not execute benchmarks in CI; numbers come from `cargo bench`.
test = false

[[example]]
name = "sdk_broker_transport"
required-features = ["sentinelpass-ipc"]
