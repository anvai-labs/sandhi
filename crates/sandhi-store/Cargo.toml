[package]
name = "sandhi-store"
description = "Durable SQLite sink + usage aggregation queries for Sandhi. Not depended on by the language bindings (keeps the wheels free of bundled SQLite)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tracing = "0.1"
sandhi-core = { path = "../sandhi-core", version = "0.0.0" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
getrandom = "0.2"
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native",
] }
# Stable SentinelPass IPC contract (message types, envelope, client).
# Pin a rev while the two repos co-evolve; switch to `tag = "v0.8.0"`
# once SentinelPass v0.8.0 is released, or path+`[patch]` for local dev:
#   [patch."https://github.com/anvai-labs/sentinelpass"]
#   sentinelpass-protocol = { path = "../../sentinelpass/sentinelpass-protocol" }
sentinelpass-protocol = { git = "https://github.com/anvai-labs/sentinelpass", rev = "1bd41648c23738e583a9eaa35600127c1fcfd070" }
tokio = { version = "1", default-features = false, features = ["rt"] }
