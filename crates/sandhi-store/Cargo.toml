[package]
name = "sandhi-store"
description = "Durable SQLite sink + usage aggregation queries for Sandhi. Not depended on by the language bindings (keeps the wheels free of bundled SQLite)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tracing = "0.1"
sandhi-core = { path = "../sandhi-core", version = "0.3.0" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
getrandom = "0.2"
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native",
] }
# Stable SentinelPass IPC contract (message types, envelope, client).
# Optional and NON-default: the IPC backend (and its tokio runtime) ships only
# where the `sentinelpass-ipc` feature is enabled — release binary builds turn
# it on; crates consumers may enable it themselves. sentinelpass-protocol
# v0.8.0 is published to crates.io, so the published manifest stays clean.
sentinelpass-protocol = { version = "0.8.0", optional = true }
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }

[features]
sentinelpass-ipc = ["dep:sentinelpass-protocol", "dep:tokio"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "ledger"
harness = false
# `cargo test` must not execute benchmarks in CI; numbers come from `cargo bench`.
test = false
