name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  # Detect what changed so a docs-only change (docs/**, README, etc.) skips
  # compilation / coverage / bindings and runs only the always-on audit
  # (attribution) + the aggregate gate. Each heavy job is gated on these
  # outputs; `CI Success` always runs (if: always()) so the required status
  # check still reports on docs-only PRs. A change to this workflow itself
  # re-runs everything (it is listed in every filter).
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      schema: ${{ steps.filter.outputs.schema }}
      sdk_conformance: ${{ steps.filter.outputs.sdk_conformance }}
      codegen: ${{ steps.filter.outputs.codegen }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            python:
              - 'crates/**'
              - 'bindings/python/**'
              - 'bindings/fixtures/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/coverage-bindings.sh'
              - '.github/workflows/ci.yml'
            node:
              - 'crates/**'
              - 'bindings/node/**'
              - 'bindings/fixtures/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/coverage-bindings.sh'
              - '.github/workflows/ci.yml'
            schema:
              - 'schemas/**'
              - '.github/workflows/ci.yml'
            sdk_conformance:
              - 'crates/**'
              - 'tests/sdk-conformance/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            codegen:
              - 'crates/sandhi-core/schemas/**'
              - 'crates/sandhi-core/src/generated/**'
              - 'schemas/**'
              - 'bindings/python/sandhi_gateway.pyi'
              - 'bindings/node/contracts.d.ts'
              - 'scripts/gen-provider-models.sh'
              - 'scripts/gen-binding-contract-facades.py'
              - '.github/workflows/ci.yml'

  rust:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  schema:
    needs: changes
    if: ${{ needs.changes.outputs.schema == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema
      - name: every shipped schema is valid JSON Schema (against its declared $schema metaschema)
        # Previously this only json.load-ed usage-event.v1. Now every schemas/*.v*.schema.json is
        # validated against its own declared metaschema — so a hand-edited or regenerated schema
        # that drifts from the spec fails here, not at a downstream consumer.
        run: check-jsonschema --check-metaschema schemas/*.v1.schema.json schemas/*.v2.schema.json

  python-binding:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: fmt + clippy (the binding is its own workspace)
        run: |
          cargo fmt --manifest-path bindings/python/Cargo.toml --check
          cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets -- -D warnings
      - run: pip install maturin
      - name: build + install the wheel (release packaging path)
        run: |
          maturin build -m bindings/python/Cargo.toml --out dist
          pip install dist/*.whl
      - name: run binding tests
        run: |
          pip install pytest
          python -m pytest bindings/python/tests/ -q
      - name: binding glue coverage (fail under 85% lines)
        # Instrumented rebuild + harness → llvm-cov over bindings/python/src/lib.rs only. The
        # --workspace coverage job never sees the glue (separate cargo workspace, foreign runtime).
        run: bash scripts/coverage-bindings.sh python

  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI-agent authorship attribution in commit messages
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check_no_agent_attribution.py \
              --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif echo "${{ github.event.before }}" | grep -qE '^0{40}$'; then
            git log -1 --format=%B > "$RUNNER_TEMP/msg.txt"
            python3 scripts/check_no_agent_attribution.py --message-file "$RUNNER_TEMP/msg.txt"
          else
            python3 scripts/check_no_agent_attribution.py \
              --range "${{ github.event.before }}..${{ github.sha }}"
          fi

  security:
    # Security/dependency gate — Sandhi previously had none. `cargo deny check advisories`
    # fails on known vulnerabilities + yanked crates (deny.toml). Runs whenever Rust deps/code
    # change (the `rust` filter includes Cargo.lock/Cargo.toml); dependabot covers new advisories
    # against unchanged deps via its own PRs.
    #
    # `actions/dependency-review-action` (per-PR diff of newly-introduced vulns) is deliberately
    # NOT here yet: it needs the repo Dependency graph enabled, which is a governance setting
    # (see Phase 2). cargo-deny advisories already covers vuln-detection across the whole tree,
    # so dependency-review is a fast-follow once the dependency graph is turned on, not a blocker.
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny advisories (known vulnerabilities + yanked crates)
        # cargo-deny-action@v2 composes `cargo-deny <arguments> <command> <command-arguments>`,
        # so the check-target (advisories) goes in `command-arguments`, NOT `arguments` — putting it
        # in `arguments` yields `cargo-deny advisories check`, which clap rejects ("unrecognized
        # subcommand 'advisories'"). `command` defaults to `check`; left explicit for readability.
        uses: embarkstudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: advisories

  lint-title:
    # Conventional-commit PR title gate. Dependabot PRs are prefixed `chore:`
    # (.github/dependabot.yml) so they pass too. PR-only (the action errors on push events).
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            chore
            build
            revert

  node-binding:
    needs: changes
    if: ${{ needs.changes.outputs.node == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: fmt + clippy (the node binding is its own workspace)
        run: |
          cargo fmt --manifest-path bindings/node/Cargo.toml --check
          cargo clippy --manifest-path bindings/node/Cargo.toml -- -D warnings
      - name: build + test (release platform artifact)
        working-directory: bindings/node
        run: |
          npm install
          npx napi build --platform
          npm test
      - name: binding glue coverage (fail under 85% lines)
        # Instrumented rebuild + harness → llvm-cov over bindings/node/src/lib.rs only (needs the
        # node_modules installed by the step above).
        run: bash scripts/coverage-bindings.sh node

  coverage:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Line coverage must stay above 75%
        # Exclude generated code (typify output) — you test the generator's schema, not the
        # generated builder/error surface, so its coverage is meaningless (ADR-0003 §2/§4).
        run: cargo llvm-cov --workspace --fail-under-lines 75 --ignore-filename-regex 'src/generated/'

  # Drift check for the typify narrow models (ADR-0003 §2/§4 — TD-0001 W3): regenerate from the
  # byte-pinned schemas and assert the committed output is unchanged. Guards the no-hand-edit rule.
  codegen-drift:
    needs: changes
    if: ${{ needs.changes.outputs.codegen == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Regenerate models and assert no drift
        run: |
          bash scripts/gen-provider-models.sh
          bash scripts/gen-chat-contract-schemas.sh
          git diff --exit-code -- crates/sandhi-core/src/generated
          git diff --exit-code -- schemas
          python3 scripts/gen-binding-contract-facades.py --check

  # Single aggregate gate for branch protection (mirrors proximaDB's "CI Success").
  # Always runs so the required check reports even when heavy jobs are skipped on
  # docs-only changes; passes unless a needed job actually failed/was cancelled
  # (a `skipped` result is a pass).
  sdk-conformance:
    name: SDK conformance (real vendor SDKs)
    needs: changes
    if: ${{ needs.changes.outputs.sdk_conformance == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The vendors' own clients decide how a request is shaped. Pinning majors keeps a vendor
      # release from turning this gate red without a code change, while still tracking real SDKs.
      - name: Install the vendor SDKs
        run: python -m pip install --quiet 'openai>=2,<3' 'anthropic>=0.97,<1' 'google-genai>=1.73,<2' 'httpx>=0.27' pytest
      - name: Drive the proxy with openai-python, anthropic-python and google-genai
        run: python -m pytest tests/sdk-conformance/ -q

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [changes, rust, schema, python-binding, node-binding, attribution, coverage, codegen-drift, sdk-conformance, security, lint-title]
    steps:
      - name: Verify no required job failed (skipped is OK for docs-only)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure|cancelled)
                echo "A required job did not pass: result=$r"
                exit 1
                ;;
            esac
          done
          echo "all required checks passed or were skipped"
