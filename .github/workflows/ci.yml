name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  # Protected-base definition for owner-authored, same-repository PRs only.
  # Every job below independently routes this event through the approval gate
  # before any pull-request code reaches the private runner pool.
  pull_request_target:

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize-owner:
    name: Authorize owner private CI
    if: >-
      github.event_name == 'pull_request_target' &&
      vars.OWNER_PRIVATE_CI_ENABLED == 'true' &&
      github.actor_id == '5168752' &&
      github.event.pull_request.user.id == 5168752 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: owner-private-ci
    steps:
      - name: Verify immutable owner and same-repository head
        env:
          ACTOR_ID: ${{ github.actor_id }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$ACTOR_ID" = "5168752"
          test "$AUTHOR_ID" = "5168752"
          test "$HEAD_REPOSITORY" = "$REPOSITORY"

  # Detect what changed so a docs-only change (docs/**, README, etc.) skips
  # compilation / coverage / bindings and runs only the always-on audit
  # (attribution) + the aggregate gate. Each heavy job is gated on these
  # outputs; `CI Success` always runs (if: always()) so the required status
  # check still reports on docs-only PRs. A change to this workflow itself
  # re-runs everything (it is listed in every filter).
  changes:
    needs: authorize-owner
    if: >-
      always() && (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' && (
          vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
          github.actor_id != '5168752' ||
          github.event.pull_request.user.id != 5168752 ||
          github.event.pull_request.head.repo.full_name != github.repository
        )) ||
        (github.event_name == 'pull_request_target' &&
          vars.OWNER_PRIVATE_CI_ENABLED == 'true' &&
          needs.authorize-owner.result == 'success')
      )
    runs-on: ${{ github.event_name == 'pull_request_target' && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      schema: ${{ steps.filter.outputs.schema }}
      sdk_conformance: ${{ steps.filter.outputs.sdk_conformance }}
      codegen: ${{ steps.filter.outputs.codegen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.0
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            python:
              - 'crates/**'
              - 'bindings/python/**'
              - 'bindings/fixtures/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/coverage-bindings.sh'
              - '.github/workflows/ci.yml'
            node:
              - 'crates/**'
              - 'bindings/node/**'
              - 'bindings/fixtures/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/coverage-bindings.sh'
              - '.github/workflows/ci.yml'
            schema:
              - 'schemas/**'
              - '.github/workflows/ci.yml'
            sdk_conformance:
              - 'crates/**'
              - 'tests/sdk-conformance/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            codegen:
              - 'crates/sandhi-core/schemas/**'
              - 'crates/sandhi-core/src/generated/**'
              - 'schemas/**'
              - 'bindings/python/sandhi_gateway.pyi'
              - 'bindings/node/contracts.d.ts'
              - 'scripts/gen-provider-models.sh'
              - 'scripts/gen-binding-contract-facades.py'
              - '.github/workflows/ci.yml'

  rust:
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request_target' && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      # Scope 5 (TD-0011 P3): the `otel-otlp` feature is default-off. Verify it builds, clippy-
      # cleans, and tests when opted in — and that the default build stays free of the
      # OpenTelemetry dependency tree (TD-0011 D1/D4: the feature must not move the default graph).
      - run: cargo clippy -p sandhi-proxy --features otel-otlp --all-targets -- -D warnings
      - run: cargo test -p sandhi-proxy --features otel-otlp
      - name: default build excludes the OTel dependency tree
        run: |
          cargo build -p sandhi-proxy
          if cargo tree -p sandhi-proxy -e no-dev | grep -q opentelemetry; then
            echo "opentelemetry leaked into the default build — the otel-otlp feature must be default-off"
            exit 1
          fi

  schema:
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.schema == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request_target' && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema
      - name: every shipped schema is valid JSON Schema (against its declared $schema metaschema)
        # Previously this only json.load-ed usage-event.v1. Now every schemas/*.v*.schema.json is
        # validated against its own declared metaschema — so a hand-edited or regenerated schema
        # that drifts from the spec fails here, not at a downstream consumer.
        run: check-jsonschema --check-metaschema schemas/*.v1.schema.json schemas/*.v2.schema.json

  python-binding:
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.python == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request_target' && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    env:
      # Self-hosted runners persist user-site packages across jobs. A sandhi-gateway left
      # there by any other work must never shadow the wheel this job just built — the
      # failure mode is silent (tests run against the stale module) and only surfaces as
      # confusing catalog misses on newly admitted providers.
      PYTHONNOUSERSITE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@ea647c55f74bb153499600c054578c0d83fa19d5 # cargo-llvm-cov 2026-08-30
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: fmt + clippy (the binding is its own workspace)
        run: |
          cargo fmt --manifest-path bindings/python/Cargo.toml --check
          cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets -- -D warnings
      - run: pip install maturin
      - name: build + install the wheel (release packaging path)
        run: |
          maturin build -m bindings/python/Cargo.toml --out dist
          # Replace, never augment: a stale install of the same name must not survive.
          pip uninstall -y sandhi-gateway || true
          pip install --force-reinstall --no-deps dist/*.whl
          # Fail loudly if anything else on sys.path still wins the import.
          python - <<'EOF'
          import sysconfig
          import sandhi_gateway
          loc = sandhi_gateway.__file__
          purelib = sysconfig.get_paths()["purelib"]
          assert loc.startswith(purelib), (
              f"stale sandhi_gateway shadows the freshly built wheel: {loc} "
              f"(expected under {purelib})"
          )
          EOF
      - name: run binding tests
        run: |
          pip install pytest
          python -m pytest bindings/python/tests/ -q
      - name: binding glue coverage (fail under 85% lines)
        # Instrumented rebuild + harness → llvm-cov over bindings/python/src/lib.rs only. The
        # --workspace coverage job never sees the glue (separate cargo workspace, foreign runtime).
        run: bash scripts/coverage-bindings.sh python

  attribution:
    needs: authorize-owner
    if: >-
      always() && (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' && (
          vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
          github.actor_id != '5168752' ||
          github.event.pull_request.user.id != 5168752 ||
          github.event.pull_request.head.repo.full_name != github.repository
        )) ||
        (github.event_name == 'pull_request_target' &&
          vars.OWNER_PRIVATE_CI_ENABLED == 'true' &&
          needs.authorize-owner.result == 'success')
      )
    runs-on: ${{ github.event_name == 'pull_request_target' && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: No AI-agent authorship attribution in commit messages
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ] || \
             [ "${{ github.event_name }}" = "pull_request_target" ]; then
            python3 scripts/check_no_agent_attribution.py \
              --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif echo "${{ github.event.before }}" | grep -qE '^0{40}$'; then
            git log -1 --format=%B > "$RUNNER_TEMP/msg.txt"
            python3 scripts/check_no_agent_attribution.py --message-file "$RUNNER_TEMP/msg.txt"
          else
            python3 scripts/check_no_agent_attribution.py \
              --range "${{ github.event.before }}..${{ github.sha }}"
          fi

  security:
    # Security/dependency gate — Sandhi previously had none. `cargo deny check advisories`
    # fails on known vulnerabilities + yanked crates (deny.toml). Runs whenever Rust deps/code
    # change (the `rust` filter includes Cargo.lock/Cargo.toml); dependabot covers new advisories
    # against unchanged deps via its own PRs.
    #
    # `actions/dependency-review-action` (per-PR diff of newly-introduced vulns) is deliberately
    # NOT here yet: it needs the repo Dependency graph enabled, which is a governance setting
    # (see Phase 2). cargo-deny advisories already covers vuln-detection across the whole tree,
    # so dependency-review is a fast-follow once the dependency graph is turned on, not a blocker.
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request_target' && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # cargo-deny shells out to `cargo metadata`, so it needs a real toolchain on PATH — the
      # self-hosted overflow runners have none preinstalled (github-hosted runners do, which is
      # why this only surfaced once owner PRs started routing there). Same pinned action the
      # rust/coverage jobs use.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
      # Keep this binary-based: Docker container actions cannot run on every private-runner host.
      - uses: taiki-e/install-action@ea647c55f74bb153499600c054578c0d83fa19d5 # 2026-08-30
        with:
          tool: cargo-deny@0.20.2
      - name: cargo-deny advisories (known vulnerabilities + yanked crates)
        run: cargo deny check advisories

  lint-title:
    # Conventional-commit PR title gate. Dependabot PRs are prefixed `chore:`
    # (.github/dependabot.yml) so they pass too. PR-only (the action errors on push events).
    needs: authorize-owner
    if: >-
      always() && (
        (github.event_name == 'pull_request' && (
          vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
          github.actor_id != '5168752' ||
          github.event.pull_request.user.id != 5168752 ||
          github.event.pull_request.head.repo.full_name != github.repository
        )) ||
        (github.event_name == 'pull_request_target' &&
          vars.OWNER_PRIVATE_CI_ENABLED == 'true' &&
          needs.authorize-owner.result == 'success')
      )
    runs-on: ${{ github.event_name == 'pull_request_target' && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            chore
            build
            revert

  node-binding:
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.node == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request_target' && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@ea647c55f74bb153499600c054578c0d83fa19d5 # cargo-llvm-cov 2026-08-30
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: fmt + clippy (the node binding is its own workspace)
        run: |
          cargo fmt --manifest-path bindings/node/Cargo.toml --check
          cargo clippy --manifest-path bindings/node/Cargo.toml -- -D warnings
      - name: build + test (release platform artifact)
        working-directory: bindings/node
        run: |
          npm ci
          npx napi build --platform
          npm test
      - name: binding glue coverage (fail under 85% lines)
        # Instrumented rebuild + harness → llvm-cov over bindings/node/src/lib.rs only (needs the
        # node_modules installed by the step above).
        run: bash scripts/coverage-bindings.sh node

  coverage:
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request_target' && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@ea647c55f74bb153499600c054578c0d83fa19d5 # cargo-llvm-cov 2026-08-30
      - name: Line coverage must stay above 75%
        # Exclude generated code (typify output) — you test the generator's schema, not the
        # generated builder/error surface, so its coverage is meaningless (ADR-0003 §2/§4).
        run: cargo llvm-cov --workspace --fail-under-lines 75 --ignore-filename-regex 'src/generated/'

  # Drift check for the typify narrow models (ADR-0003 §2/§4 — TD-0001 W3): regenerate from the
  # byte-pinned schemas and assert the committed output is unchanged. Guards the no-hand-edit rule.
  codegen-drift:
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.codegen == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request_target' && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
        with:
          components: rustfmt
      # gen-provider-models.sh invokes `cargo typify` and its own install guard
      # (`cargo install --list | grep`) can pass spuriously on the self-hosted runners while the
      # binary is not resolvable on PATH — install the pinned binary the same way the security
      # job installs cargo-deny, so drift-checking doesn't depend on host cargo-home state.
      - uses: taiki-e/install-action@ea647c55f74bb153499600c054578c0d83fa19d5 # 2026-08-30
        with:
          tool: cargo-typify@0.4.3
      - name: Regenerate models and assert no drift
        run: |
          bash scripts/gen-provider-models.sh
          bash scripts/gen-chat-contract-schemas.sh
          git diff --exit-code -- crates/sandhi-core/src/generated
          git diff --exit-code -- schemas
          python3 scripts/gen-binding-contract-facades.py --check

  # Single aggregate gate for branch protection (mirrors proximaDB's "CI Success").
  # Always runs so the required check reports even when heavy jobs are skipped on
  # docs-only changes; passes unless a needed job actually failed/was cancelled
  # (a `skipped` result is a pass).
  sdk-conformance:
    name: SDK conformance (real vendor SDKs)
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.sdk_conformance == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request_target' && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The vendors' own clients decide how a request is shaped. Pinning majors keeps a vendor
      # release from turning this gate red without a code change, while still tracking real SDKs.
      - name: Install the vendor SDKs
        run: python -m pip install --quiet 'openai>=2,<3' 'anthropic>=0.97,<1' 'google-genai>=1.73,<2' 'httpx>=0.27' pytest
      - name: Drive the proxy with openai-python, anthropic-python and google-genai
        run: python -m pytest tests/sdk-conformance/ -q

  ci-success:
    name: CI Success
    runs-on: ${{ github.event_name == 'pull_request_target' && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    if: >-
      always() && (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' && (
          vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
          github.actor_id != '5168752' ||
          github.event.pull_request.user.id != 5168752 ||
          github.event.pull_request.head.repo.full_name != github.repository
        )) ||
        (github.event_name == 'pull_request_target' &&
          vars.OWNER_PRIVATE_CI_ENABLED == 'true' &&
          needs.authorize-owner.result == 'success')
      )
    needs: [authorize-owner, changes, rust, schema, python-binding, node-binding, attribution, coverage, codegen-drift, sdk-conformance, security, lint-title]
    steps:
      - name: Verify no required job failed (skipped is OK for docs-only)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure|cancelled)
                echo "A required job did not pass: result=$r"
                exit 1
                ;;
            esac
          done
          echo "all required checks passed or were skipped"
