# CodeQL code scanning — catches security vulnerabilities, bugs, and code patterns
# in Rust, Python, and JavaScript (Node bindings).
#
# Runs on every push to trunk, every PR, and weekly (catches new queries without code changes).
name: codeql

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 07:18 UTC every Monday — spread across the fleet to avoid the :00 thundering herd.
    - cron: "18 7 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: manual
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@4eae4e89c08376aa4e18b0a56f4d20a1cfdf7d9e # v4.3.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Default queries + security-extended for broader coverage.
          queries: security-extended

      # Rust needs a manual build step — CodeQL instruments the compiler invocation.
      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30

      - if: matrix.language == 'rust'
        name: Build Rust workspace (CodeQL traces the compile)
        run: cargo build --workspace --all-targets

      - uses: github/codeql-action/analyze@4eae4e89c08376aa4e18b0a56f4d20a1cfdf7d9e # v4.3.6
        with:
          category: "/language:${{ matrix.language }}"
