name: release

# Unified version: one tag `vX.Y.Z` on `main` drives the binary/PyPI release and any configured
# crates.io/npm publishers. See RELEASING.md for the develop→main→tag flow and publisher setup.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      npm_repair_tag:
        description: "Existing vX.Y.Z tag whose npm leg failed — rebuilds + republishes npm ONLY (same OIDC Trusted-Publishing environment; crates/PyPI/binaries untouched)"
        required: true
        type: string

permissions:
  contents: write # create the GitHub Release + upload binary assets

# On a dispatch repair, only the npm half runs: every other job below carries
# `if: github.event_name == 'push'` (directly, or via a skipped `needs` chain).
jobs:
  # ── 1a. Create the GitHub Release once, so the binary matrix has a target to upload to. ────
  #        (A tag push does not auto-create a Release; without this the upload jobs fail with
  #        "release not found", and parallel jobs would otherwise race to create it.)
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "$REPO" \
                 --title "${GITHUB_REF_NAME}" --generate-notes

  # ── 1b. Native sandhi-proxy server binaries → the GitHub Release ───────────────────────────
  #        Native-only (no cross): the proxy links bundled SQLite (sandhi-store), whose C build
  #        needs the target's C toolchain. aarch64-linux is a follow-up (cross C toolchain).
  #        No x86_64-apple-darwin: Apple no longer ships Intel macs, and the `macos-13` runner
  #        that leg needed never got scheduled — it sat queued for GitHub's full 24h timeout and
  #        was auto-cancelled on every release from v0.1.0 to v0.1.2.
  binaries:
    name: binary (${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Set version from tag
        run: |
          cargo install cargo-edit --locked || true
          cargo set-version "${GITHUB_REF_NAME#v}"
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          # Both workspace binaries: the server AND the `sandhi` operator CLI.
          # The homebrew-tap formula installs both; the CLI was missing from
          # archives before v0.2.1 (anvai-labs/homebrew-tap consumes these).
          bin: sandhi-proxy, sandhi
          # The SentinelPass daemon-IPC vault backend is feature-gated so the
          # crates.io publish carries no git dependency; binaries keep it.
          features: sentinelpass-ipc
          target: ${{ matrix.target }}
          archive: sandhi-proxy-$tag-$target
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. PyPI wheels (sandhi-gateway) — build matrix + OIDC Trusted Publishing ───────────────
  pypi-build:
    if: github.event_name == 'push'
    name: wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Set version from tag
        shell: bash
        run: |
          cargo install cargo-edit --locked || true
          ( cd bindings/python && cargo set-version "${GITHUB_REF_NAME#v}" )
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -m bindings/python/Cargo.toml --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  pypi-publish:
    needs: pypi-build
    runs-on: ubuntu-latest
    environment: pypi # scope the OIDC trusted publisher (configure on PyPI, see RELEASING.md)
    permissions:
      id-token: write # OIDC — no stored token
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # ── 3. crates.io (core → providers → store → proxy) ───────────────────────────────────────
  crates:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
            exit 0
          fi
          # Skip-if-published makes the job re-runnable after a partial
          # failure: a bare rerun would die on "crate already published" for
          # every member that landed before the hiccup.
          already_published() {
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "sandhi-release" \
              "https://crates.io/api/v1/crates/$1/${GITHUB_REF_NAME#v}")
            [ "$status" = "200" ]
          }
          publish_member() {
            if already_published "$1"; then
              echo "::notice::$1 ${GITHUB_REF_NAME} already on crates.io — skipping"
            else
              cargo publish -p "$1" --allow-dirty
            fi
          }
          cargo install cargo-edit --locked || true
          cargo set-version "${GITHUB_REF_NAME#v}"
          # --allow-dirty: the only working-tree change is the intentional set-version rewrite
          publish_member sandhi-core
          publish_member sandhi-providers
          publish_member sandhi-store
          publish_member sandhi-proxy

  # ── 4. npm (@anvailabs/sandhi) — per-platform native builds + napi prepublish ──────────────
  #        Intel-mac leg dropped for the same reason as the binaries matrix above; because
  #        `npm-publish` needs the whole build matrix, that stuck leg is what kept npm from ever
  #        publishing. Publishing is OIDC Trusted Publishing — no token, no skip path.
  npm-build:
    name: npm build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      # On a dispatch repair the tag being rebuilt is the input, not the triggering ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.npm_repair_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build native addon
        working-directory: bindings/node
        env:
          RELEASE_TAG: ${{ inputs.npm_repair_tag || github.ref_name }}
        run: |
          # Fail HERE, not after the whole matrix burned: a malformed or empty repair
          # input would otherwise only die at npm-publish's stricter guards.
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;; # vX.Y.Z
            *) echo "::error::RELEASE_TAG '$RELEASE_TAG' is not a vX.Y.Z tag"; exit 1;;
          esac
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
          npm install
          npx napi build --platform --release
      - uses: actions/upload-artifact@v7
        with:
          name: napi-${{ matrix.target }}
          path: bindings/node/*.node

  npm-publish:
    needs: npm-build
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): the npm Trusted-Publisher binding on npmjs.com pins
    # (repository anvai-labs/sandhi, workflow release.yml, environment npm) — no token exists
    # anywhere to leak or rotate. id-token: write is what mints the OIDC assertion; the
    # environment must match the binding exactly. Node 24 ships npm ≥11, which speaks OIDC.
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.npm_repair_tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v8
        with:
          pattern: napi-*
          merge-multiple: true
          path: bindings/node/artifacts
      - name: Publish to npm
        working-directory: bindings/node
        env:
          RELEASE_TAG: ${{ inputs.npm_repair_tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;; # vX.Y.Z
            *) echo "::error::RELEASE_TAG '$RELEASE_TAG' is not a vX.Y.Z tag"; exit 1;;
          esac
          git ls-remote --exit-code --tags origin "$RELEASE_TAG" >/dev/null \
            || { echo "::error::tag $RELEASE_TAG does not exist"; exit 1; }
          VERSION="${RELEASE_TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm install
          # @napi-rs/cli 2.x: generate the per-platform package dirs from the config before
          # placing artifacts — `napi artifacts` writes INTO npm/<platform>/ and dies with a
          # bare ENOENT when the parent dir is missing (the v0.5.1 npm-leg failure; the dirs
          # are gitignored here by design, so they must be derived at publish time). `-t .`
          # is required: 2.18.4 declares the target dir option with no default.
          npx napi create-npm-dir -t .
          npx napi artifacts --dir artifacts
          # A dispatch repair must not be able to go green while publishing nothing:
          # download-artifact exits 0 on an empty pattern match and prepublish merely
          # warns per missing binary — so assert every generated platform dir actually
          # received its .node before publishing anything.
          expected=$(find npm -mindepth 1 -maxdepth 1 -type d | wc -l)
          placed=$(find npm -mindepth 2 -maxdepth 2 -name '*.node' | wc -l)
          if [ "$placed" -ne "$expected" ] || [ "$expected" -eq 0 ]; then
            echo "::error::expected $expected platform binaries under npm/, found $placed"
            ls -R npm || true
            exit 1
          fi
          # Idempotent repair (mirror of the crates job's skip-if-published): a platform
          # package@version already on the registry is dropped so prepublish warn-skips
          # it — otherwise a rerun after a partial publish hard-fails E403 and we are
          # back to burning a version.
          for dir in npm/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            if npm view "$name@$VERSION" --loglevel=error version >/dev/null 2>&1; then
              echo "::notice::$name@$VERSION already published — skipping platform package"
              rm -rf "$dir"
            fi
          done
          # `napi prepublish` publishes the PER-PLATFORM packages only (and stamps versions
          # + optionalDependencies into package.json); the MAIN package needs an explicit
          # root publish — exactly how the CLI's own template wires it (prepublishOnly hook
          # + `npm publish --access public`).
          npx napi prepublish -t npm --skip-gh-release
          if npm view "@anvailabs/sandhi@$VERSION" --loglevel=error version >/dev/null 2>&1; then
            echo "::notice::@anvailabs/sandhi@$VERSION already published — skipping main publish"
          else
            npm publish --access public
          fi

  # ── 5. Verify the artifacts actually landed ───────────────────────────────────────────────
  #        The crates.io publish step `exit 0`s when its credential is absent, so a job can report
  #        success while shipping nothing. That is intentional for an unconfigured target, but the
  #        same guard would hide a genuinely broken publish — and a green release run is exactly
  #        when nobody looks. This checks the registries, not the jobs.
  verify:
    needs: [create-release, pypi-publish, crates, npm-publish]
    # always() would defeat the needs-chain skip on a dispatch repair — gate on the event too.
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify every expected registry received this tag
        env:
          # Expectation is derived from configuration, never assumed: a target with no credential
          # is reported as an intentional skip instead of silently passing.
          EXPECT_CRATES: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
          EXPECT_NPM: "1" # Trusted Publishing: npm is always expected; the verifier checks the registry, not a token
        run: python3 scripts/verify-release.py "${GITHUB_REF_NAME}"
