name: release
# Stable milestones only. Remote authority controls remain required; see RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      npm_repair_tag:
        description: "Stable tag with safeguard-era main CI; dispatch from main; npm only"
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ inputs.npm_repair_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.guard.outputs.source_sha }}
      control_sha: ${{ steps.guard.outputs.control_sha }}
      version: ${{ steps.guard.outputs.version }}
      tag: ${{ steps.guard.outputs.tag }}
      proof_id: ${{ steps.proof.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Authorize immutable source against canonical main CI
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_TAG: ${{ inputs.npm_repair_tag }}
        run: python3 scripts/release_guard.py --output proof.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: proof
        with:
          name: release-authorization
          path: proof.json
          if-no-files-found: error
          retention-days: 30

  binaries:
    if: github.event_name == 'push'
    needs: authorize
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: macos-latest, target: aarch64-apple-darwin}
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
      RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
      EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
      EXPECTED_CONTROL_SHA: ${{ needs.authorize.outputs.control_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.control_sha }}
          persist-credentials: false
          path: .release-controls
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Stage unified Rust version
        shell: bash
        run: |
          cargo install cargo-edit --version 0.13.13 --locked
          cargo set-version "$RELEASE_VERSION"
      - name: Build and smoke-test both operator binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --features sentinelpass-ipc --target "$TARGET" --bin sandhi-proxy --bin sandhi
          python3 .release-controls/scripts/smoke-release-binaries.py --binary-dir "target/$TARGET/release"
          mkdir dist-binaries
          tar -czf "dist-binaries/sandhi-proxy-$RELEASE_TAG-$TARGET.tar.gz" -C "target/$TARGET/release" sandhi-proxy sandhi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-${{ matrix.target }}
          path: dist-binaries/*.tar.gz
          if-no-files-found: error

  pypi-build:
    if: github.event_name == 'push'
    needs: authorize
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
      RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
      EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
      EXPECTED_CONTROL_SHA: ${{ needs.authorize.outputs.control_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Stage unified Rust version
        shell: bash
        run: |
          cargo install cargo-edit --version 0.13.13 --locked
          cargo set-version "$RELEASE_VERSION"
      - name: Stage Python version
        shell: bash
        working-directory: bindings/python
        run: cargo set-version "$RELEASE_VERSION"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: build
          args: --release -m bindings/python/Cargo.toml --out dist
          manylinux: auto
      - name: Install and import the built wheel
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import sandhi_gateway"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  npm-build:
    needs: authorize
    name: npm build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: macos-latest, target: aarch64-apple-darwin}
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
      RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
      EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
      EXPECTED_CONTROL_SHA: ${{ needs.authorize.outputs.control_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Build and load native addon
        working-directory: bindings/node
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          npx --no-install napi build --platform --release
          node -e "require('./sandhi.js')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: napi-${{ matrix.target }}
          path: |
            bindings/node/*.node
            bindings/node/index.js
            bindings/node/index.d.ts
          if-no-files-found: error

  npm-package:
    needs: [authorize, npm-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package_id: ${{ steps.packages.outputs.artifact-id }}
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
      RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
      EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
      EXPECTED_CONTROL_SHA: ${{ needs.authorize.outputs.control_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.control_sha }}
          persist-credentials: false
          path: .release-controls
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: napi-*
          merge-multiple: true
          path: bindings/node/artifacts
      - name: Prepare complete platforms and validate actual packed contents
        working-directory: bindings/node
        run: |
          npm ci --ignore-scripts
          npx --no-install napi create-npm-dir -t .
          npx --no-install napi artifacts --dir artifacts
          cp artifacts/index.js artifacts/index.d.ts .
          node ../../.release-controls/scripts/check-npm-release.mjs prepare --package-dir . --version "$RELEASE_VERSION"
          node ../../.release-controls/scripts/check-npm-release.mjs pack --package-dir . --version "$RELEASE_VERSION" --output-dir ../../dist-npm > ../../npm-pack.json
          cp ../../npm-pack.json ../../dist-npm/manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: packages
        with:
          name: npm-packages
          path: dist-npm/
          if-no-files-found: error

  crates-check:
    if: github.event_name == 'push'
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Check staged release versions without publishing credentials
        run: |
          cargo install cargo-edit --version 0.13.13 --locked
          cargo set-version "$RELEASE_VERSION"
          cargo check --workspace --all-targets

  create-release:
    if: github.event_name == 'push'
    needs: [authorize, binaries, pypi-build, npm-package, crates-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
      RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
      EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
      EXPECTED_CONTROL_SHA: ${{ needs.authorize.outputs.control_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.control_sha }}
          persist-credentials: false
          path: .release-controls
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.authorize.outputs.proof_id }}
          merge-multiple: true
          path: .release-proof
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist-binaries
      - name: Revalidate release authority immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release-controls/scripts/release_guard.py --verify-proof .release-proof/proof.json
      - name: Publish built binary assets without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --max-time 20 -o release-response.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          case "$status" in
            200) ;;
            404) gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes ;;
            *) echo "::error::GitHub release lookup unavailable ($status)"; exit 1 ;;
          esac
          for archive in dist-binaries/*.tar.gz; do
            python3 .release-controls/scripts/release_guard.py --verify-proof .release-proof/proof.json
            name=$(basename "$archive")
            assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets)
            if jq -e --arg name "$name" '.assets[] | select(.name == $name)' <<< "$assets" >/dev/null; then
              mkdir -p existing
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir existing
              cmp "$archive" "existing/$name"
            else
              gh release upload "$RELEASE_TAG" "$archive" --repo "$GITHUB_REPOSITORY"
            fi
          done

  pypi-publish:
    needs: [authorize, create-release, pypi-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
      RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
      EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
      EXPECTED_CONTROL_SHA: ${{ needs.authorize.outputs.control_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.control_sha }}
          persist-credentials: false
          path: .release-controls
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.authorize.outputs.proof_id }}
          merge-multiple: true
          path: .release-proof
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Revalidate release authority immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release-controls/scripts/release_guard.py --verify-proof .release-proof/proof.json
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist
          skip-existing: true

  crates:
    if: github.event_name == 'push'
    needs: [authorize, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
      RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
      EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
      EXPECTED_CONTROL_SHA: ${{ needs.authorize.outputs.control_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.control_sha }}
          persist-credentials: false
          path: .release-controls
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.authorize.outputs.proof_id }}
          merge-multiple: true
          path: .release-proof
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Stage unified Rust version
        shell: bash
        run: |
          cargo install cargo-edit --version 0.13.13 --locked
          cargo set-version "$RELEASE_VERSION"
      - name: Publish all required crates in dependency order
        env:
          GH_TOKEN: ${{ github.token }}
          # New environment-only credential; NO fallback to the legacy repository secret.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_RELEASE_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "::error::Required crates-io environment credential missing"; exit 1; }
          for crate in sandhi-core sandhi-providers sandhi-store sandhi-proxy; do
            status=$(curl --silent --show-error --max-time 20 -o crate-response.json -w '%{http_code}' -A sandhi-release "https://crates.io/api/v1/crates/$crate/$RELEASE_VERSION")
            case "$status" in
              200) echo "$crate version exists; final verification still required" ;;
              404)
                python3 .release-controls/scripts/release_guard.py --verify-proof .release-proof/proof.json
                # Staged workspace checked in the separate, unprivileged crates-check job.
                # Do not compile dependency/build.rs code while holding the registry token.
                cargo publish -p "$crate" --allow-dirty --no-verify
                ;;
              *) echo "::error::Crates lookup unavailable ($status)"; exit 1 ;;
            esac
          done

  npm-publish:
    needs: [authorize, npm-package, create-release]
    # A repair intentionally skips the non-npm graph. A full release must pass ALL builds
    # and create its binary release before any registry publisher is allowed to write.
    if: >-
      !cancelled() && needs.authorize.result == 'success' && needs.npm-package.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.create-release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
      RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
      EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
      EXPECTED_CONTROL_SHA: ${{ needs.authorize.outputs.control_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.control_sha }}
          persist-credentials: false
          path: .release-controls
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.authorize.outputs.proof_id }}
          merge-multiple: true
          path: .release-proof
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.npm-package.outputs.package_id }}
          merge-multiple: true
          path: dist-npm
      - name: Revalidate release authority immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release-controls/scripts/release_guard.py --verify-proof .release-proof/proof.json
      - name: Publish only checked tarballs; preserve complete dependencies on retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release-controls/scripts/publish-npm-release.py --package-dir dist-npm --version "$RELEASE_VERSION" --proof .release-proof/proof.json

  verify:
    needs: [authorize, create-release, pypi-publish, crates, npm-publish]
    if: ${{ !cancelled() && needs.authorize.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.control_sha }}
          persist-credentials: false
          path: .release-controls
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify every declared release target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          if [ "$RELEASE_EVENT" = workflow_dispatch ]; then
            python3 .release-controls/scripts/verify-release.py "$RELEASE_TAG" --targets npm
          else
            python3 .release-controls/scripts/verify-release.py "$RELEASE_TAG" --targets pypi,crates,npm,github
          fi
