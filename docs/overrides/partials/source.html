{# A plain repository link avoids background GitHub statistics/version requests. #}
<a href="{{ config.repo_url }}" title="{{ lang.t('source') }}" class="md-source">
  <div class="md-source__icon md-icon">
    {% include ".icons/fontawesome/brands/git-alt.svg" %}
  </div>
  <div class="md-source__repository">{{ config.repo_name }}</div>
</a>
