<g font-size="12" text-anchor="middle" fill="#0f766e"><text x="231" y="201">Resource token</text><text x="456" y="201">Compatible API</text><text x="682" y="201">One attempt</text><text x="346" y="60">Introspection on every request · current grant and revocation</text><text x="720" y="239">Source usage returned</text></g>
<g fill="#ecfdf5" stroke="#99f6e4"><rect x="28" y="263" width="410" height="65" rx="9"/><rect x="480" y="263" width="410" height="65" rx="9"/></g>
