<text x="28" y="35" font-size="20" font-weight="700">Local OIDC co-design · actual identity and Agent flow</text>
<g fill="#ffffff" stroke="#cbd5e1"><rect x="28" y="88" width="184" height="88" rx="10"/><rect x="254" y="88" width="184" height="88" rx="10"/><rect x="480" y="88" width="184" height="88" rx="10"/><rect x="706" y="88" width="184" height="88" rx="10"/></g>
<g font-size="17" font-weight="700" text-anchor="middle"><text x="120" y="122">Anvai Identity</text><text x="346" y="122">Victor Agent</text><text x="572" y="122">Sandhi gateway</text><text x="798" y="122">Test model</text></g>
