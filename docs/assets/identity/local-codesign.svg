<svg xmlns="http://www.w3.org/2000/svg" width="920" height="370" viewBox="0 0 920 370" role="img" aria-labelledby="title desc">
<title id="title">Locally tested Anvai Identity, Victor and Sandhi flow</title>
<desc id="desc">Anvai Identity issues resource access tokens to Victor. Sandhi introspects each token before one model attempt. Two requests settle two fourteen-token receipts. This is a local fixture, not a live deployment.</desc>
